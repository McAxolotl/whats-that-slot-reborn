plugins {
  id 'net.neoforged.moddev' version '2.0.107' apply false
  id 'fabric-loom' version '1.10.5' apply false
  id 'idea'
}

subprojects {
  apply plugin: 'java-library'

  group = maven_group
  version = "$mod_version+$minecraft_version" + (release.toBoolean() ? "" : "-beta")

  java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
  }

  repositories {
    mavenCentral()
  }

  tasks.withType(JavaCompile).configureEach {
    it.options.encoding = 'UTF-8'
    it.options.release = 21
  }

  dependencies {
    compileOnly 'com.google.code.findbugs:jsr305:3.0.1'
  }

  tasks.withType(ProcessResources).configureEach {
    def manifestProperties = [
            version: project.version,
            minecraft_version: minecraft_version,
            minecraft_version_range: minecraft_version_range,
            fabric_loader_version: fabric_loader_version,
            neoforge_version: neoforge_version,
            neoforge_loader_version_range: neoforge_loader_version_range,
            mod_name: mod_name,
            mod_author: mod_author,
            mod_id: mod_id,
            license: license,
            description: project.description,
            credits: credits,
    ]
    inputs.properties manifestProperties
    filesMatching(['fabric.mod.json', 'META-INF/neoforge.mods.toml']) {
      expand manifestProperties
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
  }

  tasks.withType(Jar).configureEach {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from(rootProject.file('LICENSE')) {
      rename { "${it}_${mod_id}" }
    }
    from(rootProject.file('COPYING')) {
      rename { "${it}_${mod_id}" }
    }
  }
}

idea {
  module {
    downloadSources = true
    downloadJavadoc = true
  }
}
