plugins {
  id 'net.fabricmc.fabric-loom'
}

base {
  archivesName = "$mod_file_name-fabric"
}

loom {

  runs {
    client {
      client()
      setConfigName 'Fabric Client'
      ideConfigGenerated true
      runDir "../run/$minecraft_version/fabric"
    }
  }
  mods {
    "${mod_id}" {
      sourceSet project.sourceSets.main
    }
  }
}

repositories {
  maven {
    url "https://maven.shedaniel.me"
    content { includeGroupByRegex 'me\\.shedaniel.*' }
  }
  maven {
    url "https://maven.architectury.dev"
    content { includeGroup 'dev.architectury' }
  }
  maven {
    url "https://maven.blamejared.com"
    content {
      includeGroup 'mezz.jei'
      includeGroup 'net.mezzdev.config'
    }
    metadataSources {
      mavenPom()
      artifact()
      ignoreGradleMetadataRedirection()
    }
  }
}

sourceSets.main.java.srcDirs rootProject.file('common/src/main/java'), rootProject.file('common/src/rei/java'), rootProject.file('common/src/jei/java')
sourceSets.main.resources.srcDir rootProject.file('common/src/main/resources')

dependencies {
  minecraft "com.mojang:minecraft:$minecraft_version"

  implementation "net.fabricmc:fabric-loader:$fabric_loader_version"
  implementation(include(fabricApi.module("fabric-api-base", fabric_version)))
  implementation(include(fabricApi.module("fabric-resource-loader-v1", fabric_version)))

  compileOnly("me.shedaniel:RoughlyEnoughItems-api-fabric:$rei_version") { transitive = false }
  compileOnly("dev.architectury:architectury-fabric:$architectury_version") { transitive = false }
  compileOnly "me.shedaniel.cloth:basic-math:$cloth_version"
  compileOnly("mezz.jei:jei-$jei_minecraft_version-common-api:$jei_version") { transitive = false }

  if (providers.gradleProperty('withRei').get().toBoolean() || providers.gradleProperty('withJei').get().toBoolean()) {
    runtimeOnly "net.fabricmc.fabric-api:fabric-api:$fabric_version"
  }

  if (providers.gradleProperty('withJei').get().toBoolean()) {
    runtimeOnly "mezz.jei:jei-$jei_minecraft_version-fabric:$jei_version"
  }

  if (providers.gradleProperty('withRei').get().toBoolean()) {
    runtimeOnly "dev.architectury:architectury-fabric:$architectury_version"
    runtimeOnly "me.shedaniel:RoughlyEnoughItems-fabric:$rei_version"
  }
}
