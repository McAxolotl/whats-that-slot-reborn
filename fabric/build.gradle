plugins {
  id 'fabric-loom'
}

base {
  archivesName = "$mod_file_name-fabric"
}

loom {
  mixin {
    defaultRefmapName.set("${mod_id}.refmap.json")
  }
  runs {
    client {
      client()
      setConfigName 'Fabric Client'
      ideConfigGenerated true
      runDir "../run/$minecraft_version/fabric"
    }
  }
  mods {
    "${mod_id}" {
      sourceSet project.sourceSets.main
    }
  }
}

repositories {
  maven {
    url "https://maven.shedaniel.me"
    content { includeGroupByRegex 'me\\.shedaniel.*' }
  }
  maven {
    url "https://maven.architectury.dev"
    content { includeGroup 'dev.architectury' }
  }
}

sourceSets.main.java.srcDirs rootProject.file('common/src/main/java'), rootProject.file('common/src/rei/java')
sourceSets.main.resources.srcDir rootProject.file('common/src/main/resources')

dependencies {
  minecraft "com.mojang:minecraft:$minecraft_version"
  mappings loom.officialMojangMappings()

  modImplementation "net.fabricmc:fabric-loader:$fabric_loader_version"
  modImplementation(include(fabricApi.module("fabric-api-base", fabric_version)))
  modImplementation(include(fabricApi.module("fabric-resource-loader-v1", fabric_version)))
  modImplementation(include(fabricApi.module("fabric-resource-loader-v0", fabric_version)))

  modCompileOnly("me.shedaniel:RoughlyEnoughItems-api-fabric:$rei_version") { transitive = false }
  modCompileOnly("dev.architectury:architectury-fabric:$architectury_version") { transitive = false }
  compileOnly "me.shedaniel.cloth:basic-math:$cloth_version"

  if (providers.gradleProperty('withRei').get().toBoolean()) {
    modLocalRuntime "net.fabricmc.fabric-api:fabric-api:$fabric_version"
    modLocalRuntime "dev.architectury:architectury-fabric:$architectury_version"
    modLocalRuntime "me.shedaniel:RoughlyEnoughItems-fabric:$rei_version"
  }
}
